server:
  port: 8080

spring:
  application:
    name: keycloak-spring-demo

  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 5000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: demo-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.demo.keycloak.messaging"

  security:
    oauth2:
      # KC_INTERNAL_URL : base URL the app (backend) uses to reach Keycloak.
      #                   In Docker: http://keycloak:8180 (service name on the shared network).
      #                   On host  : override to http://localhost:8180
      # KC_EXTERNAL_URL : base URL the browser uses (public IP). Used for the login/logout
      #                   redirects and to validate the "iss" claim in tokens.
      resourceserver:
        jwt:
          # iss claim is minted by Keycloak using its advertised (external) hostname
          issuer-uri: ${KC_EXTERNAL_URL:http://13.228.73.108:8180}/realms/master
          # keys are fetched by the backend → must be internally reachable (no discovery, no startup crash)
          jwk-set-uri: ${KC_INTERNAL_URL:http://keycloak:8180}/realms/master/protocol/openid-connect/certs

      client:
        registration:
          keycloak:
            client-id: spring-demo-client
            client-secret: super-secret-client-key
            scope: openid, profile, email, roles
            authorization-grant-type: authorization_code
            # APP_EXTERNAL_URL : the app's own public base URL the browser is redirected back to
            redirect-uri: "${APP_EXTERNAL_URL:http://13.228.73.108:8080}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            # NOTE: no issuer-uri here on purpose — it triggers eager OIDC discovery at startup,
            # which fails when the public IP is unreachable from inside the container.
            # Endpoints are declared explicitly instead, split by audience:
            authorization-uri: ${KC_EXTERNAL_URL:http://13.228.73.108:8180}/realms/master/protocol/openid-connect/auth   # browser
            token-uri:         ${KC_INTERNAL_URL:http://keycloak:8180}/realms/master/protocol/openid-connect/token         # backend
            jwk-set-uri:       ${KC_INTERNAL_URL:http://keycloak:8180}/realms/master/protocol/openid-connect/certs          # backend
            user-info-uri:     ${KC_INTERNAL_URL:http://keycloak:8180}/realms/master/protocol/openid-connect/userinfo       # backend
            user-name-attribute: preferred_username

app:
  keycloak:
    realm: master
    server-url: http://13.228.73.108:8180
    client-id: spring-demo-client

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

rabbitmq:
  exchange: demo.exchange
  queue: user.events.queue
  routing-key: user.event
  dead-letter-exchange: demo.dead-letter.exchange
  dead-letter-queue: user.events.dead-letter.queue
  dead-letter-routing-key: user.event.dead

kafka:
  topics:
    user-events: user-events
    user-events-dlt: user-events.DLT

logging:
  level:
    org.springframework.security: DEBUG
    com.demo.keycloak: DEBUG
